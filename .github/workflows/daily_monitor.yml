name: Daily Classroom Monitor

on:
  schedule:
    - cron: '0 10 * * *'
      timezone: Europe/Berlin
  workflow_dispatch:
    inputs:
      operation:
        description: Operation
        type: choice
        options: [monitor, dry-run, initialize-state, list-uncertain, resolve]
        default: monitor
      notification_key:
        description: For resolve only; copy the key from list-uncertain
        type: string
      resolution:
        description: For resolve only; check Telegram before choosing
        type: choice
        options: [sent, retry]
        default: sent

permissions:
  contents: write

concurrency:
  group: classroom-monitor-state
  cancel-in-progress: false

jobs:
  monitor:
    # State includes private school data; the application also verifies privacy.
    if: github.event.repository.private == true && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.1-flash-lite' }}
      GEMINI_TIMEOUT_SECONDS: ${{ vars.GEMINI_TIMEOUT_SECONDS || '120' }}
      GEMINI_MAX_ATTEMPTS: ${{ vars.GEMINI_MAX_ATTEMPTS || '3' }}
      GEMINI_RETRY_BASE_SECONDS: ${{ vars.GEMINI_RETRY_BASE_SECONDS || '5' }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      STATE_BACKEND: github
      READ_ATTACHMENTS: ${{ vars.READ_ATTACHMENTS || 'true' }}
      TEACHER_MODE: ${{ vars.TEACHER_MODE || 'false' }}
      DAILY_SUMMARY: ${{ vars.DAILY_SUMMARY || 'false' }}
      NOTIFY_POSSIBLE: ${{ vars.NOTIFY_POSSIBLE || 'true' }}
      MIN_CONFIDENCE: ${{ vars.MIN_CONFIDENCE || '50' }}
      LOOKAHEAD_DAYS: ${{ vars.LOOKAHEAD_DAYS || '180' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Restore state, execute, and durably checkpoint deliveries
        env:
          OPERATION: ${{ inputs.operation || 'monitor' }}
          NOTIFICATION_KEY: ${{ inputs.notification_key }}
          RESOLUTION: ${{ inputs.resolution }}
        # Inputs stay in environment variables; never interpolate user input as shell code.
        shell: bash
        run: |
          case "$OPERATION" in
            monitor) python main.py ;;
            dry-run) python main.py --dry-run ;;
            initialize-state) python main.py --initialize-state ;;
            list-uncertain) python main.py --list-uncertain ;;
            resolve) python main.py --resolve "$NOTIFICATION_KEY" --resolution "$RESOLUTION" ;;
            *) echo 'Unsupported operation'; exit 1 ;;
          esac
